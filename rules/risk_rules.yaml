# Правила оценки риска Wi-Fi сетей.
# Файл отделён от кода намеренно: критерии можно менять и дополнять,
# не трогая Python. Движок правил — в src/airguard/risk.py.

# 1. Базовый уровень риска по типу шифрования.
#    Имена ключей должны совпадать со значениями поля "security",
#    которые отдаёт Swift-коллектор.
security_levels:
  "Open (нет шифрования)":
    level: "CRITICAL"
    reason: "Сеть без шифрования: трафик передаётся открыто и может быть перехвачен."
    recommendation: "Включить WPA2 или WPA3 и задать надёжный пароль."

  "WEP":
    level: "CRITICAL"
    reason: "WEP — устаревший протокол, взламывается за минуты."
    recommendation: "Срочно перейти на WPA2/WPA3."

  "WPA":
    level: "HIGH"
    reason: "WPA (первого поколения) устарел и уязвим к ряду атак."
    recommendation: "Обновить роутер/настройки до WPA2 или WPA3."

  "WPA2":
    level: "MEDIUM"
    reason: "WPA2 — распространённый стандарт, но уязвим к атаке KRACK и перебору слабых паролей."
    recommendation: "Использовать длинный пароль; по возможности включить WPA3."

  "WPA3":
    level: "LOW"
    reason: "WPA3 — современный протокол с защитой от перебора."
    recommendation: "Дополнительных действий не требуется."

  default:
    level: "MEDIUM"
    reason: "Тип защиты не определён однозначно."
    recommendation: "Проверить настройки безопасности сети вручную."

# 2. Дополнительные проверки. Могут повысить (escalate_to) уровень риска.
#    Поддерживаемые типы: ssid_contains, hidden_ssid, weak_signal.
extra_checks:
  - type: ssid_contains
    values: ["TP-LINK_", "Rostelecom_", "RT-", "Keenetic-", "default", "linksys", "dlink"]
    reason: "Имя сети похоже на заводское — пароль может быть стандартным/предсказуемым."
    recommendation: "Сменить имя сети (SSID) и пароль по умолчанию."
    escalate_to: "HIGH"

  - type: hidden_ssid
    reason: "Скрытая сеть создаёт ложное чувство защиты: имя всё равно раскрывается при подключении клиента."
    recommendation: "Не полагаться на скрытие SSID как на меру защиты."
    # уровень не повышаем, только отмечаем
